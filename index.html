<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phishing Link Checker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-6 rounded-xl shadow w-full max-w-md">
    <h1 class="text-xl font-bold mb-3">🛡️ Phishing Link Checker</h1>
    <input id="url" class="border w-full p-2 rounded mb-3"
           placeholder="Paste link here">
    <button onclick="check()"
            class="bg-blue-600 text-white w-full p-2 rounded">Check</button>
    <div id="result" class="mt-4"></div>
  </div>
<script>
async function check() {
  const url = document.getElementById("url").value;
  const r = await fetch("/check", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({url})
  });
  const d = await r.json();
  const box = document.getElementById("result");
  box.innerHTML = "";
  const title = document.createElement("p");
  title.className = "font-bold " + (d.verdict === "DANGEROUS" ? "text-red-600"
    : d.verdict === "SUSPICIOUS" ? "text-yellow-600" : "text-green-600");
  title.textContent = d.verdict + " (score " + d.score + ")";
  const ul = document.createElement("ul");
  ul.className = "list-disc ml-5 text-sm";
  d.reasons.forEach(t => {
    const li = document.createElement("li");
    li.textContent = t;
    ul.appendChild(li);
  });
  box.append(title, ul);
}
</script>
</body>
</html>
